services:
  postgres:
    image: postgres:16-alpine
    container_name: vacante-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vacante
      POSTGRES_DB: vacante
      # Base LOCAL de desarrollo: no lleva contraseña. El puerto se publica solo en 127.0.0.1,
      # así que el contenedor no es alcanzable desde la red, y adentro solo hay datos de prueba
      # que las migraciones vuelven a crear.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - vacante_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vacante -d vacante']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vacante_pgdata:
